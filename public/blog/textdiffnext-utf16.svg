<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">textdiffnext keeps every index in UTF-16 code units</title>
  <desc id="desc">A JavaScript string is a sequence of UTF-16 code units. textdiffnext diffs, patches, and serializes in that coordinate system. Surrogate pairs stay as %uXXXX instead of being rewritten as UTF-8 bytes.</desc>
  <rect width="960" height="420" rx="16" fill="#18181b"/>
  <rect x="28" y="36" width="430" height="168" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="48" y="68" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">JavaScript string</text>
  <text x="48" y="100" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">UTF-16 code units</text>
  <text x="48" y="136" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">"A" "😀" is length 3, not 2</text>
  <text x="48" y="164" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">high surrogate + low surrogate</text>
  <text x="48" y="188" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">the host already counts this way</text>
  <rect x="502" y="36" width="430" height="168" rx="12" fill="#09090b" stroke="#e4e4e7"/>
  <text x="522" y="68" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">textdiffnext</text>
  <text x="522" y="100" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">same coordinates</text>
  <text x="522" y="136" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">diff / match / patch indices</text>
  <text x="522" y="164" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">%uD83D%uDE00 in the patch text</text>
  <text x="522" y="188" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">no UTF-8 byte translation</text>
  <rect x="140" y="248" width="680" height="140" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="160" y="284" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">what was removed</text>
  <text x="160" y="318" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">diff_toDeltaUtf8Indices / applyPatchesUtf8</text>
  <text x="160" y="348" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">those helpers mapped UTF-16 indices onto UTF-8 bytes</text>
  <text x="160" y="372" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">a JS caller that used .length would land on the wrong unit</text>
  <path d="M458 120 H502" fill="none" stroke="#71717a" stroke-width="1.5"/>
  <path d="M717 204 V248" fill="none" stroke="#71717a" stroke-width="1.5"/>
</svg>
