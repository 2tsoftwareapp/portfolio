<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">jsondiffnext wraps three engines with hash-guarded bundles</title>
  <desc id="desc">JSON values enter admission checks, an engine adapter produces a delta, SHA-256 of RFC 8785 canonical JSON pins the base and result, and apply/revert stage on a clone.</desc>
  <rect width="960" height="420" rx="16" fill="#18181b"/>
  <rect x="28" y="36" width="170" height="140" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="44" y="68" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">input</text>
  <text x="44" y="98" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">before / after</text>
  <text x="44" y="128" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">JSON values only</text>
  <text x="44" y="152" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">no cycles, no getters</text>
  <rect x="262" y="36" width="190" height="140" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="278" y="68" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">admission</text>
  <text x="278" y="98" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">work / depth</text>
  <text x="278" y="128" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">keyed-array ids</text>
  <text x="278" y="152" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">or root-replace</text>
  <rect x="516" y="28" width="210" height="156" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="532" y="60" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">engine adapter</text>
  <text x="532" y="90" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">fast-json-patch</text>
  <text x="532" y="114" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">jsondiffpatch</text>
  <text x="532" y="138" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">rfc6902</text>
  <text x="532" y="164" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">one bundle API</text>
  <rect x="790" y="36" width="142" height="140" rx="12" fill="#09090b" stroke="#e4e4e7"/>
  <text x="806" y="68" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">v1 bundle</text>
  <text x="806" y="98" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">baseHash</text>
  <text x="806" y="122" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">resultHash</text>
  <text x="806" y="152" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">fwd / inverse</text>
  <rect x="140" y="236" width="680" height="148" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="160" y="272" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">apply / revert</text>
  <text x="160" y="306" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">1. check document hash against the pin</text>
  <text x="160" y="334" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">2. clone, patch the clone, never the caller object</text>
  <text x="160" y="362" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">3. check the staging hash, freeze, return the clone</text>
  <path d="M198 176 H262" fill="none" stroke="#71717a" stroke-width="1.5"/>
  <path d="M452 106 H516" fill="none" stroke="#71717a" stroke-width="1.5"/>
  <path d="M726 106 H790" fill="none" stroke="#71717a" stroke-width="1.5"/>
  <path d="M861 176 V236" fill="none" stroke="#71717a" stroke-width="1.5"/>
</svg>
